<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mariage Clara & Adrián - RSVP</title>
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="accueil">

  <!-- Titre -->
  <header class="header-title">
    <h1 id="titre-principal">Clara & Adrián</h1>
  </header>

  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="index.html" id="nav-accueil">Accueil</a></li>
      <li><a href="infos.html" id="nav-infos">Infos</a></li>
      <li><a href="rsvp.html" id="nav-rsvp">RSVP</a></li>
      <li><a href="galerie.html" id="nav-galerie">Galerie</a></li>
      <li><button id="lang-toggle">ES / FR</button></li> <!-- déplacé dans la liste -->
    </ul>
  </nav>

<main class="rsvp-container">
  <form id="rsvp-form">
    <h2 id="rsvp-title">Seriez-vous présent ?</h2>
    
    <div class="attend-options">
        <input type="radio" id="rsvp-oui" name="presence" value="oui" checked>
        <label for="rsvp-oui" id="label-oui">Oui</label>

        <input type="radio" id="rsvp-non" name="presence" value="non">
        <label for="rsvp-non" id="label-non">Non, j'ai aqua poney</label>
    </div>

    <div class="name-section">
        <label for="guest-name" id="label-name">Votre nom :</label>
        <input list="guest-list" id="guest-name" name="guest-name" placeholder="Tapez votre nom..." required>
        <datalist id="guest-list"></datalist>
    </div>
    
    <button type="submit" id="submit-button">Confirmer</button>
    <p id="thank-you-message"></p>
  </form>
</main>


    <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
